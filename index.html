  for(let v of arr){

}

  card.innerHTML=
    `<div class="head">
      <span class="title" style="color:${c.color}">${c.title}</span>
      <span class="badge">权重 ${c.weight}%</span>
    </div>
    <div class="chart-wrap"><canvas id="c${c.key}"></canvas></div>`;
  grid.appendChild(card);
});

// ── 置顶：总体合计 S 曲线 ──
(function(){
  const td = d['total'];
  new Chart(document.getElementById('cTotalTop'),{
    type:'line',
    data:{
      labels: labels.slice(0, td.length),
      datasets:[{
        data: td,
        borderColor: '#f97316',
        backgroundColor: '#f9731618',
        borderWidth: 3,
        pointRadius: 2,
        pointHoverRadius: 6,
        pointBackgroundColor: '#f97316',
        tension: 0.35,
        fill: true,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:l=>'累计: '+l.parsed.y+'%'}}},
      scales:{
        x:{ticks:{color:'#64748b',font:{size:9},maxRotation:45},grid:{color:'rgba(148,163,184,.06)'}},
        y:{min:0,max:100,ticks:{color:'#64748b',font:{size:9},stepSize:20,callback:v=>v+'%'},grid:{color:'rgba(148,163,184,.06)'}}
      }
    }
  });
})();

// 绘制 — 各自用截断后的 labels + data
cards.forEach(c=>{
  const data = d[c.key];
  const cutLabels = labels.slice(0, data.length);
  new Chart(document.getElementById('c'+c.key),{
    type:'line',
    data:{
      labels: cutLabels,
      datasets:[{
        data: data,
        borderColor: c.color,
        backgroundColor: c.color+'18',
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointBackgroundColor: c.color,
        tension: 0.35,
        fill: true,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:l=>'累计: '+l.parsed.y+'%'}}},
      scales:{
        x:{ticks:{color:'#64748b',font:{size:9},maxRotation:45},grid:{color:'rgba(148,163,184,.06)'}},
        y:{min:0,max:100,ticks:{color:'#64748b',font:{size:9},stepSize:20,callback:v=>v+'%'},grid:{color:'rgba(148,163,184,.06)'}}
      }
    }
  });
});
</script>
