function getColor(pct){
  if(pct>=90)return'#6bcb77';
  if(pct>=60)return'#38bdf8';
  if(pct>=30)return'#fbbf24';
  return'#f97316';
}

function renderNode(parent,nodes){
  nodes.forEach(n=>{
    var div=document.createElement('div');
    div.className='node l'+n.depth;
    var line=document.createElement('div');
    line.className='line';
    
    var toggle=document.createElement('span');
    toggle.className='toggle';
    if(n.children.length>0){
      toggle.textContent='▾';
      toggle.onclick=function(){
        var ch=div.querySelector('.children');
        if(ch){
          var c=ch.classList.contains('collapsed');
          ch.classList.toggle('collapsed');
          if(c){ch.style.maxHeight=ch.scrollHeight+'px';}
          else{ch.style.maxHeight='0';}
          this.textContent=c?'▾':'▸';
        }
      };
    }else{toggle.textContent='·';toggle.style.cursor='default'}
    line.appendChild(toggle);
    
    var cd=document.createElement('span');
    cd.className='code';cd.textContent=n.code;line.appendChild(cd);
    
    // progress bar
    var pw=document.createElement('div');
    pw.className='prog-wrap';
    var pf=document.createElement('div');
    pf.className='prog-fill';
    pf.style.width=n.progress+'%';
    pf.style.background=getColor(n.progress);
    pw.appendChild(pf);
    line.appendChild(pw);
    
    var pt=document.createElement('span');
    pt.className='prog-text';
    pt.textContent=n.progress+'%';
    pt.style.color=getColor(n.progress);
    line.appendChild(pt);
    
    var nm=document.createElement('span');
    nm.className='name';nm.textContent=n.name;line.appendChild(nm);
    
    var b=document.createElement('span');
    b.className='weight-badge';
    b.textContent=(n.depth===1?'总权重 ':'权重 ')+n.weight+'%';
    line.appendChild(b);
    
    if(n.children.length>0){
      var cnt=document.createElement('span');
      cnt.className='count-badge';cnt.textContent='('+n.children.length+')';line.appendChild(cnt);
    }
    
    div.appendChild(line);
    
    if(n.children.length>0){
      var chDiv=document.createElement('div');
      chDiv.className='children';
      renderNode(chDiv,n.children);
      div.appendChild(chDiv);
      if(n.depth===1){
        chDiv.classList.remove('collapsed');
        setTimeout(function(){chDiv.style.maxHeight=chDiv.scrollHeight+'px';},20);
      }
      if(n.depth===2){
        chDiv.classList.add('collapsed');
        chDiv.style.maxHeight='0';
      }
    }
    parent.appendChild(div);
  });
}

// 一键展开/收起
function expandTo(maxDepth){
  document.querySelectorAll('.node').forEach(nd=>{
    var m=nd.className.match(/l(\d+)/);
    if(!m)return;
    var depth=parseInt(m[1]);
    var ch=nd.querySelector(':scope>.children');
    if(!ch)return;
    var toggle=nd.querySelector(':scope>.line>.toggle');
    if(depth >= maxDepth || maxDepth===99){
      ch.classList.add('collapsed');
      ch.style.maxHeight='0';
      if(toggle)toggle.textContent='▸';
    }else{
      ch.classList.remove('collapsed');
      ch.style.maxHeight=ch.scrollHeight+'px';
      if(toggle)toggle.textContent='▾';
    }
  });
}
